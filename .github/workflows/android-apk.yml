
name: Build NOVA Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: nova-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build NOVA APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-33 build-tools;33.0.2"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build NOVA Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/NOVA-debug.apk
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Stage6-Debug
          path: dist/NOVA-debug.apk
          if-no-files-found: error
          retention-days: 30
